<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let palabra='JavaScript';
        document.write('La palabra es: ',palabra);
        document.write('<br>');

        //ver tamaño de un texto
        document.write('Cantidad de letras: ',palabra.length);
        document.write('<br>');

        //ver caracteres específicos en un texto
        document.write('Primeras 4 letras: ',palabra.slice(0,4));
        document.write('<br>');

        //ver caracteres específicos en un texto
        document.write('Primeras 4 letras: ',palabra.substring(0,4));
        document.write('<br>');

        //cambiar valores en un texto
        let saludo ='Hola a todos';
        saludo= saludo.replace('Hola', 'adios');
        document.write(saludo);
        document.write('<br>');

        //poner un texto en mayúsculas
        document.write('en mayúsculas: ',palabra.toUpperCase());
        document.write('<br>');

        //poner un texto en minúsculas
        document.write('en mayúsculas: ',palabra.toLowerCase());
        document.write('<br>');

        //unión de texto
        let palabra2 = 'Curso de '
        document.write('unir palabras: ',palabra2.concat(palabra));
        document.write('<br>');

        //acortar espacios entre textos
        let palabra3 = '   Hola    ';
        document.write(palabra3);
        document.write('<br>');
        document.write(palabra3.trimStart());
        document.write('<br>');
        document.write(palabra3.trimEnd());
        document.write('<br>');

        //reducir cantidad de caracteres
        document.write(palabra.split('Script'));














    </script>
    
</body>
</html>
